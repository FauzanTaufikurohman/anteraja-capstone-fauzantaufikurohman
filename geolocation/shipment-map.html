<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Peta pelacakan pengiriman dan kurir di area Jakarta."
    />
    <title>Shipment Tracker</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/shipment-map.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="page">
      <div data-partial="partials/header.html"></div>

      <div id="map" aria-label="Peta lokasi pengiriman"></div>
      <div id="status" class="status" role="status" aria-live="polite">
        Menyiapkan peta...
      </div>

      <div data-partial="partials/shipment-legend.html"></div>
      <div
        id="info-window-partial"
        data-partial="partials/shipment-info.html"
        hidden
      ></div>
    </main>
  </body>
</html>
